name: Build release
run-name: Building ${{ github.ref_name }} after push of release tag

on:
  push:
    tags:
      - "release-*_*_*"

permissions: write-all

jobs:
  release:
    defaults:
      run:
        working-directory: code

    runs-on: ubuntu-latest

    steps:
    - name: Check out code
      # with the whole history, which the choice of backend branch below needs
      # in order to test ancestry; blobs are fetched on demand, so this stays
      # a treeless fetch rather than a full clone
      uses: actions/checkout@v7
      with:
        path: 'code'
        fetch-depth: 0
        filter: 'blob:none'
    - name: Assemble release notes
      # the note on getting past the warnings for the unsigned installers,
      # and this release's change log; see release/README.md, "The release
      # page". Written outside the checkout, since the build below cleans
      # release/target; the installers job leaves the body alone
      run: bash release/github/release-notes.sh > "$RUNNER_TEMP/release-notes.md"
    - name: Check out grammars
      uses: actions/checkout@v7
      with:
        repository: 'nl-utwente-groove/grammars'
        path: 'grammars'
    - name: Check out samples
      uses: actions/checkout@v7
      with:
        repository: 'nl-utwente-groove/samples'
        path: 'samples'
    - name: Choose the backend branch
      # The rule of backend.yml - the branch of the private repository that
      # carries the same name as the branch being built, if there is one, and
      # main otherwise - in the form a tag allows. It matters for a test
      # release (see release/README.md, "Deploying"), which is built from a
      # branch precisely because nothing is merged yet, and whose backend
      # counterpart is then on a branch of the private repository rather than
      # on main.
      #
      # A tag carries no branch name, and matching only the branches whose tip
      # IS the tagged commit would miss the ordinary case, in which the tag
      # sits on a short-lived branch a version bump ahead of the branch the
      # interface change lives on. The candidates are therefore the branches
      # whose tip is an ancestor of the tagged commit - the branch tagged and
      # everything it was branched off - and the add-on is built from the
      # nearest of those that the private repository also has; an exact tip
      # match, being at distance 0, still wins. A release tagged on master
      # yields no candidate that the private repository has, its default
      # branch being main, and is built from main as before.
      env:
        TOKEN: ${{ secrets.YFILES_LIB_TOKEN }}
      run: |
        REF=main
        LIB=https://x-access-token:$TOKEN@github.com/nl-utwente-groove/yfiles-lib.git
        CANDIDATES=$(git for-each-ref --format='%(objectname) %(refname:lstrip=3)' refs/remotes/origin           | while read -r SHA BRANCH; do
              if [ "$BRANCH" != HEAD ] && git merge-base --is-ancestor "$SHA" "$GITHUB_SHA"; then
                echo "$(git rev-list --count "$SHA..$GITHUB_SHA") $BRANCH"
              fi
            done | sort -k1,1n -k2,2 | awk '{ print $2 }')
        for BRANCH in $CANDIDATES; do
          if git ls-remote --exit-code --heads "$LIB" "refs/heads/$BRANCH" > /dev/null; then
            REF="$BRANCH"
            break
          fi
        done
        echo "Building the yFiles add-on from nl-utwente-groove/yfiles-lib at $REF"
        echo "YFILES_REF=$REF" >> "$GITHUB_ENV"
    - name: Check out yFiles library
      # The licensed yFiles library, its runtime license file and the source of
      # the yFiles backend (the repository's root project) live in a private
      # repository (see release/README.md, "How to build the yFiles add-on");
      # the token is a fine-grained PAT with read access to that
      # repository only. Only this
      # workflow uses the library: the ordinary build of pull requests
      # (maven.yml) never sees it.
      uses: actions/checkout@v7
      with:
        repository: 'nl-utwente-groove/yfiles-lib'
        ref: ${{ env.YFILES_REF }}
        token: ${{ secrets.YFILES_LIB_TOKEN }}
        path: 'yfiles-lib'
    - name: Set up JDK 21
      uses: actions/setup-java@v5
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven
    - name: Retrieve VERSION from the pom
      # the release poms are a separate reactor that receives the version
      # via -Drevision; the main pom's revision property is the source
      run: echo "VERSION=$(mvn -B -q help:evaluate -Dexpression=revision -DforceStdout)" >> $GITHUB_ENV
    - name: Build GROOVE
      run: mvn -B clean install
    - name: Install yFiles library
      # into the local Maven repository, under the coordinates the yFiles
      # backend depends on; the version is the backend pom's yfiles.version
      run: |
        YFILES_VERSION=$(mvn -B -q -f ../yfiles-lib/pom.xml help:evaluate -Dexpression=yfiles.version -DforceStdout)
        mvn -B -q install:install-file -Dfile=../yfiles-lib/lib/yfiles-for-java-swing.jar -DgroupId=com.yworks.yfiles -DartifactId=yfiles-for-java-swing -Dversion=$YFILES_VERSION -Dpackaging=jar
    - name: Install a virtual display
      # the backend's tests open Simulator windows; they run under Xvfb (the
      # Robot tests, which need a real pointer, skip by assumption)
      run: sudo apt-get update && sudo apt-get install -y xvfb
    - name: Build yFiles backend
      # from the private repository checked out above, against the GROOVE
      # artifact just installed; the license directory and the fixture
      # grammars are found through the backend pom's defaults for this
      # sibling layout. The tests are not skipped: an add-on whose tests did
      # not run must not be released
      run: xvfb-run -a -s "-screen 0 1600x1200x24" mvn -B -f ../yfiles-lib/pom.xml -Dgroove.install.skip=true -Drevision=$VERSION clean install
    - name: Build release
      # the yfiles profile adds the add-on zip to the standard zips
      run: cd release; mvn -B -Drevision=$VERSION -Pyfiles clean package
    - name: Deploy release
      uses: ncipollo/release-action@v1.21.0
      with:
        # the READ-ME asset carries its message in its name, for those who
        # read nothing but the asset list
        artifacts: "code/release/target/*.zip,code/release/github/IF-WINDOWS-OR-MACOS-BLOCKS-THE-INSTALLER.txt"
        bodyFile: "${{ runner.temp }}/release-notes.md"
        draft: false
        # version numbers starting at 99 are reserved for test releases (see
        # release/README.md); marking them as pre-releases keeps them from
        # becoming the repository's latest release. Every other version goes
        # out as a full release, so a test release needs no workflow edit on
        # the tagged commit. The installers job leaves the flag alone
        # (omitPrereleaseDuringUpdate)
        prerelease: ${{ startsWith(env.VERSION, '99.') }}

  # Builds self-contained installers (with bundled Java runtime) via jpackage
  # and attaches them to the release created by the job above. jpackage can
  # only build for the platform it runs on, hence the matrix.
  installers:
    needs: release

    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-latest   # Windows x64 (.msi)
          - macos-latest     # macOS aarch64 (.dmg)
          # Intel image; guaranteed to exist only until August 2027, after
          # which github drops x64 macOS runners altogether
          - macos-15-intel   # macOS x64 (.dmg)
          - ubuntu-latest    # Linux x64 (.deb)

    runs-on: ${{ matrix.os }}

    defaults:
      run:
        working-directory: code
        shell: bash

    steps:
    - name: Check out code
      uses: actions/checkout@v7
      with:
        path: 'code'
    - name: Set up JDK 21
      uses: actions/setup-java@v5
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven
    - name: Retrieve VERSION from the pom
      # tr -d '\r' guards against CRLF maven output on the windows runner
      run: echo "VERSION=$(mvn -B -q help:evaluate -Dexpression=revision -DforceStdout | tr -d '\r')" >> $GITHUB_ENV
    - name: Build GROOVE
      run: mvn -B -DskipTests -Dmaven.javadoc.skip=true clean install
    - name: Build release zip
      # bin+doc is excluded because it needs the javadoc skipped above
      run: cd release; mvn -B -Drevision=$VERSION -pl '!assembly/bin+doc' clean package
    - name: Build installer
      run: bash release/jpackage/build-installer.sh $VERSION
    - name: Attach installer to release
      uses: ncipollo/release-action@v1.21.0
      with:
        artifacts: "code/release/jpackage/target/dist/*"
        allowUpdates: true
        omitBodyDuringUpdate: true
        omitNameDuringUpdate: true
        omitDraftDuringUpdate: true
        omitPrereleaseDuringUpdate: true
