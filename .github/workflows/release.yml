name: Build release
run-name: Building ${{ github.ref_name }} after push of release tag

on:
  push:
    tags:
      - "release-*_*_*"

permissions: write-all

jobs:
  release:
    defaults:
      run:
        working-directory: code

    runs-on: ubuntu-latest

    steps:
    - name: Check out code
      uses: actions/checkout@v7
      with:
        path: 'code'
    - name: Assemble release notes
      # the note on getting past the warnings for the unsigned installers,
      # and this release's change log; see release/README.md, "The release
      # page". Written outside the checkout, since the build below cleans
      # release/target; the installers job leaves the body alone
      run: bash release/github/release-notes.sh > "$RUNNER_TEMP/release-notes.md"
    - name: Check out grammars
      uses: actions/checkout@v7
      with:
        repository: 'nl-utwente-groove/grammars'
        path: 'grammars'
    - name: Check out samples
      uses: actions/checkout@v7
      with:
        repository: 'nl-utwente-groove/samples'
        path: 'samples'
    - name: Check out yFiles library
      # The licensed yFiles library, its runtime license file and the source of
      # the yFiles backend (groove-yfiles/) live in a private repository (see
      # release/README.md, "How to build the yFiles add-on"); the token is a
      # fine-grained PAT with read access to that repository only. Only this
      # workflow uses the library: the ordinary build of pull requests
      # (maven.yml) never sees it.
      uses: actions/checkout@v7
      with:
        repository: 'nl-utwente-groove/yfiles-lib'
        token: ${{ secrets.YFILES_LIB_TOKEN }}
        path: 'yfiles-lib'
    - name: Set up JDK 21
      uses: actions/setup-java@v5
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven
    - name: Retrieve VERSION from the pom
      # the release poms are a separate reactor that receives the version
      # via -Drevision; the main pom's revision property is the source
      run: echo "VERSION=$(mvn -B -q help:evaluate -Dexpression=revision -DforceStdout)" >> $GITHUB_ENV
    - name: Build GROOVE
      run: mvn -B clean install
    - name: Install yFiles library
      # into the local Maven repository, under the coordinates the yFiles
      # backend depends on; the version is the backend pom's yfiles.version
      run: |
        YFILES_VERSION=$(mvn -B -q -f ../yfiles-lib/groove-yfiles/pom.xml help:evaluate -Dexpression=yfiles.version -DforceStdout)
        mvn -B -q install:install-file -Dfile=../yfiles-lib/yfiles-for-java-swing.jar -DgroupId=com.yworks.yfiles -DartifactId=yfiles-for-java-swing -Dversion=$YFILES_VERSION -Dpackaging=jar
    - name: Build yFiles backend
      # from the private repository checked out above, against the GROOVE
      # artifact just installed; the license directory defaults to the root of
      # that checkout, where the license file is committed. The backend's tests
      # open Simulator windows and are run by the developer, not on this
      # headless runner
      run: mvn -B -f ../yfiles-lib/groove-yfiles/pom.xml -Dgroove.install.skip=true -Drevision=$VERSION -DskipTests clean install
    - name: Build release
      # the yfiles profile adds the add-on zip to the standard zips
      run: cd release; mvn -B -Drevision=$VERSION -Pyfiles clean package
    - name: Deploy release
      uses: ncipollo/release-action@v1.21.0
      with:
        # the READ-ME asset carries its message in its name, for those who
        # read nothing but the asset list
        artifacts: "code/release/target/*.zip,code/release/github/IF-WINDOWS-OR-MACOS-BLOCKS-THIS-INSTALLER-READ-ME.txt"
        bodyFile: "${{ runner.temp }}/release-notes.md"
        draft: false
        prerelease: false

  # Builds self-contained installers (with bundled Java runtime) via jpackage
  # and attaches them to the release created by the job above. jpackage can
  # only build for the platform it runs on, hence the matrix.
  installers:
    needs: release

    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-latest   # Windows x64 (.msi)
          - macos-latest     # macOS aarch64 (.dmg)
          # Intel image; guaranteed to exist only until August 2027, after
          # which github drops x64 macOS runners altogether
          - macos-15-intel   # macOS x64 (.dmg)
          - ubuntu-latest    # Linux x64 (.deb)

    runs-on: ${{ matrix.os }}

    defaults:
      run:
        working-directory: code
        shell: bash

    steps:
    - name: Check out code
      uses: actions/checkout@v7
      with:
        path: 'code'
    - name: Set up JDK 21
      uses: actions/setup-java@v5
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven
    - name: Retrieve VERSION from the pom
      # tr -d '\r' guards against CRLF maven output on the windows runner
      run: echo "VERSION=$(mvn -B -q help:evaluate -Dexpression=revision -DforceStdout | tr -d '\r')" >> $GITHUB_ENV
    - name: Build GROOVE
      run: mvn -B -DskipTests -Dmaven.javadoc.skip=true clean install
    - name: Build release zip
      # bin+doc is excluded because it needs the javadoc skipped above
      run: cd release; mvn -B -Drevision=$VERSION -pl '!assembly/bin+doc' clean package
    - name: Build installer
      run: bash release/jpackage/build-installer.sh $VERSION
    - name: Attach installer to release
      uses: ncipollo/release-action@v1.21.0
      with:
        artifacts: "code/release/jpackage/target/dist/*"
        allowUpdates: true
        omitBodyDuringUpdate: true
        omitNameDuringUpdate: true
        omitDraftDuringUpdate: true
        omitPrereleaseDuringUpdate: true
