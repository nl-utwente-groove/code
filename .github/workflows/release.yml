name: Build release
run-name: Building ${{ github.ref_name }} after push of release tag

on:
  push:
    tags:
      - "release-*_*_*"

permissions: write-all

jobs:
  release:
    defaults:
      run:
        working-directory: code

    runs-on: ubuntu-latest

    steps:
    - name: Check out code
      # with the whole history, which the choice of backend branch below needs
      # in order to test ancestry; blobs are fetched on demand, so this stays
      # a treeless fetch rather than a full clone
      uses: actions/checkout@v7
      with:
        path: 'code'
        fetch-depth: 0
        filter: 'blob:none'
    - name: Assemble release notes
      # the note on getting past the warnings for the unsigned installers,
      # and this release's change log; see release/README.md, "The release
      # page". Written outside the checkout, since the build below cleans
      # release/target; the installers job leaves the body alone
      run: bash release/github/release-notes.sh > "$RUNNER_TEMP/release-notes.md"
    - name: Check out grammars
      uses: actions/checkout@v7
      with:
        repository: 'nl-utwente-groove/grammars'
        path: 'grammars'
    - name: Check out samples
      uses: actions/checkout@v7
      with:
        repository: 'nl-utwente-groove/samples'
        path: 'samples'
    - name: Choose the library branch
      # by the ancestry rule of release/github/choose-backend.sh, shared with
      # backend.yml: the nearest of the branches the tagged commit descends
      # from that the private repository also has, else main. It matters for
      # a test release (see release/README.md, "Deploying") of a branch that
      # has a counterpart in the private repository, as for an upgrade of the
      # library
      env:
        TOKEN: ${{ secrets.YFILES_LIB_TOKEN }}
      run: |
        REF=$(bash release/github/choose-backend.sh "$GITHUB_SHA")
        echo "Taking the yFiles library from nl-utwente-groove/yfiles-lib at $REF"
        echo "YFILES_REF=$REF" >> "$GITHUB_ENV"
    - name: Check out yFiles library
      # The licensed yFiles library and its runtime license file live in a
      # private repository (see release/README.md, "How to build the
      # obfuscated yFiles jars"); the token is a fine-grained PAT with read access to that
      # repository only. Only this workflow and backend.yml use the library:
      # the ordinary build of pull requests (maven.yml) never sees it.
      uses: actions/checkout@v7
      with:
        repository: 'nl-utwente-groove/yfiles-lib'
        ref: ${{ env.YFILES_REF }}
        token: ${{ secrets.YFILES_LIB_TOKEN }}
        path: 'yfiles-lib'
    - name: Record the library commit
      # the commit checked out above, which the branch name does not fix, as
      # an HTML comment at the end of the release notes: invisible on the
      # release page, in the raw body (gh release view --json body). It fixes
      # the library jar, which with the tagged commit of this repository is
      # the input needed to regenerate the obfuscation's name mapping, which
      # is never published (see release/README.md, "Building")
      run: echo "<!-- yFiles library taken from nl-utwente-groove/yfiles-lib at $(git -C ../yfiles-lib rev-parse HEAD) -->" >> "$RUNNER_TEMP/release-notes.md"
    - name: Set up JDK 21
      uses: actions/setup-java@v5
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven
    - name: Retrieve VERSION from the pom
      # the release poms are a separate reactor that receives the version
      # via -Drevision; the main pom's revision property is the source
      run: echo "VERSION=$(mvn -B -q help:evaluate -Dexpression=revision -DforceStdout)" >> $GITHUB_ENV
    - name: Check the pom version and the tag
      # the pom's revision must be a release version x.y.z, and the tag
      # release-x_y_z must name it. The build's enforcer rule admits a
      # -SNAPSHOT suffix, which a release must not have, and the tag filter
      # above admits release-7_5_4-SNAPSHOT as well, so the form is checked
      # here in full. The asset names and the pre-release flag follow the pom,
      # not the tag, so a tag on a commit whose revision was not updated would
      # otherwise publish mislabelled assets, and a test release as a full
      # one; this stops the run before anything is built or published
      run: |
        if ! [[ "$VERSION" =~ ^(0|[1-9][0-9]?)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
          echo "::error::A release needs a pom revision of the form x.y.z, with natural numbers x < 100, y and z, but the tagged commit has $VERSION"
          exit 1
        fi
        EXPECTED=$(echo "${GITHUB_REF_NAME#release-}" | tr _ .)
        if [ "$VERSION" != "$EXPECTED" ]; then
          echo "::error::Tag $GITHUB_REF_NAME expects pom revision $EXPECTED, but the tagged commit has $VERSION"
          exit 1
        fi
    - name: Build GROOVE
      run: mvn -B clean install
    - name: Install yFiles library
      # into the local Maven repository, under the coordinates the yFiles
      # backend depends on; the version is the backend pom's yfiles.version
      run: |
        YFILES_VERSION=$(mvn -B -q -f yfiles/pom.xml help:evaluate -Dexpression=yfiles.version -DforceStdout)
        mvn -B -q install:install-file -Dfile=../yfiles-lib/lib/yfiles-for-java-swing.jar -DgroupId=com.yworks.yfiles -DartifactId=yfiles-for-java-swing -Dversion=$YFILES_VERSION -Dpackaging=jar
    - name: Install a virtual display
      # the backend's tests open Simulator windows; they run under Xvfb (the
      # Robot tests, which need a real pointer, skip by assumption)
      run: sudo apt-get update && sudo apt-get install -y xvfb
    - name: Build yFiles backend
      # the unit in yfiles/, against the GROOVE artifact just installed; the
      # license directory is found through the backend pom's default for the
      # sibling layout of the two checkouts. The tests are not skipped: a
      # backend whose tests did not run must not be released
      run: xvfb-run -a -s "-screen 0 1600x1200x24" mvn -B -f yfiles/pom.xml -Dgroove.install.skip=true -Drevision=$VERSION clean install
    - name: Build release
      # the yfiles profile adds the obfuscation of the yFiles jars and the
      # zip with them, groove-x_y_z-yfiles-bin.zip, which the zip glob of the
      # next step attaches next to the plain zips. It also runs the backend's
      # tests on an obfuscation of the backend (release/README.md, "Checking
      # the result"), which open Simulator windows, hence Xvfb as above
      run: cd release; xvfb-run -a -s "-screen 0 1600x1200x24" mvn -B -Drevision=$VERSION -Pyfiles clean package
    - name: Deploy release
      uses: ncipollo/release-action@v1.21.0
      with:
        # the READ-ME asset carries its message in its name, for those who
        # read nothing but the asset list
        artifacts: "code/release/target/*.zip,code/release/github/IF-WINDOWS-OR-MACOS-BLOCKS-THE-INSTALLER.txt"
        # a zip that fails to upload must fail the job: by default the action
        # only warns, and the release goes out without it
        artifactErrorsFailBuild: true
        bodyFile: "${{ runner.temp }}/release-notes.md"
        draft: false
        # version numbers starting at 99 are reserved for test releases (see
        # release/README.md); marking them as pre-releases keeps them from
        # becoming the repository's latest release. Every other version goes
        # out as a full release, so a test release needs no workflow edit on
        # the tagged commit. The installers job leaves the flag alone
        # (omitPrereleaseDuringUpdate)
        prerelease: ${{ startsWith(env.VERSION, '99.') }}

  # Builds self-contained installers (with bundled Java runtime) via jpackage
  # and attaches them to the release created by the job above. jpackage can
  # only build for the platform it runs on, hence the matrix; one entry per
  # installer, since jpackage builds one type per run.
  #
  # There is one set of installers, and they contain yFiles. These runners
  # have neither the licensed library nor the token for it, and build nothing
  # of GROOVE themselves: each downloads groove-x_y_z-yfiles-bin.zip from the
  # release the job above has just published and packages that, so that an
  # installer holds the very jars of the zip next to it, obfuscated once.
  # Without that asset the job fails; it never falls back on the plain zip,
  # since the release page says that the installers contain yFiles.
  installers:
    needs: release

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest   # Windows x64
            type: msi
          - os: macos-latest     # macOS aarch64
            type: dmg
          # Intel image; guaranteed to exist only until August 2027, after
          # which github drops x64 macOS runners altogether
          - os: macos-15-intel   # macOS x64
            type: dmg
          - os: ubuntu-latest    # Linux x64
            type: deb
          - os: ubuntu-latest    # Linux x64
            type: rpm

    runs-on: ${{ matrix.os }}

    defaults:
      run:
        working-directory: code
        shell: bash

    steps:
    - name: Check out code
      uses: actions/checkout@v7
      with:
        path: 'code'
    - name: Set up JDK 25
      # jpackage bundles a runtime trimmed from the JDK it runs on, so this
      # is the Java the installers ship, independent of the Java 21 that the
      # code targets and the release job builds with: 25 explores 2.5-6.5%
      # faster than 21 at the same heap. Its JEP 472 warning on FlatLaf's
      # native library is covered by the launcher jars' manifest attribute
      # (release/runnable/pom.xml). Maven is used below only to read the
      # version from the pom
      uses: actions/setup-java@v5
      with:
        java-version: '25'
        distribution: 'temurin'
        cache: maven
    - name: Retrieve VERSION from the pom
      # tr -d '\r' guards against CRLF maven output on the windows runner
      run: echo "VERSION=$(mvn -B -q help:evaluate -Dexpression=revision -DforceStdout | tr -d '\r')" >> $GITHUB_ENV
    - name: Download the zip with yFiles
      # from the release of this tag, to where the installer script looks for
      # it. The release job has checked that the tag names the pom's version,
      # so the asset name follows from VERSION. gh fails if no asset matches
      # the pattern, which stops the job before anything is packaged
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        mkdir -p release/target
        gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
          --pattern "groove-${VERSION//./_}-yfiles-bin.zip" --dir release/target
    - name: Install rpmbuild
      # jpackage needs rpmbuild for the rpm type; the ubuntu image ships the
      # rpm package that provides it, but the install is cheap insurance
      # against the image dropping it
      if: matrix.type == 'rpm'
      run: sudo apt-get install -y rpm
    - name: Build installer
      # the third argument has the script package the zip just downloaded
      # and show LICENSE-YFILES.txt from it on the licence page
      run: bash release/jpackage/build-installer.sh $VERSION ${{ matrix.type }} yfiles
    - name: Attach installer to release
      uses: ncipollo/release-action@v1.21.0
      with:
        artifacts: "code/release/jpackage/target/dist/*"
        allowUpdates: true
        omitBodyDuringUpdate: true
        omitNameDuringUpdate: true
        omitDraftDuringUpdate: true
        omitPrereleaseDuringUpdate: true
        # an installer that fails to upload must fail its matrix entry: by
        # default the action only warns, which left test release 99.0.9
        # without its Apple-silicon image under a green run (the upload could
        # not resolve uploads.github.com). The failed entry can be re-run by
        # itself, the others being unaffected (fail-fast is off)
        artifactErrorsFailBuild: true
