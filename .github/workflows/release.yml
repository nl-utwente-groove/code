name: Build release
run-name: Building ${{ github.ref_name }} after push of release tag

on:
  push:
    tags:
      - "release-*_*_*"
  # Temporary, to prove the installer build without making a release: allows
  # running this workflow manually from the Actions tab. A manual run skips
  # the release job and uploads the installers as workflow artifacts instead
  # of release assets. Remove once a real release has exercised the
  # installers job.
  workflow_dispatch:

permissions: write-all

jobs:
  release:
    if: github.event_name == 'push'

    defaults:
      run:
        working-directory: code

    runs-on: ubuntu-latest

    steps:
    - name: Check out code
      uses: actions/checkout@v4
      with:
        path: 'code'
    - name: Check out grammars
      uses: actions/checkout@v4
      with:
        repository: 'nl-utwente-groove/grammars'
        path: 'grammars'
    - name: Check out samples
      uses: actions/checkout@v4
      with:
        repository: 'nl-utwente-groove/samples'
        path: 'samples'
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven
    - name: Retrieve VERSION from file
      run: echo "VERSION=$(<src/main/resources/nl/utwente/groove/resource/version/GROOVE_VERSION)" >> $GITHUB_ENV
    - name: Build GROOVE
      run: mvn -B -Drevision=$VERSION clean install
    - name: Build release
      run: cd release; mvn -B -Drevision=$VERSION clean package
    - name: Deploy release
      uses: ncipollo/release-action@v1.14.0
      with:
        artifacts: "code/release/target/*.zip"
        draft: false
        prerelease: false

  # Builds self-contained installers (with bundled Java runtime) via jpackage
  # and attaches them to the release created by the job above. jpackage can
  # only build for the platform it runs on, hence the matrix.
  installers:
    needs: release
    # run also when the release job is skipped (manual workflow_dispatch run)
    if: ${{ !cancelled() && (needs.release.result == 'success' || github.event_name == 'workflow_dispatch') }}

    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-latest   # Windows x64 (.msi)
          - macos-latest     # macOS aarch64 (.dmg)
          - macos-13         # macOS x64 (.dmg)
          - ubuntu-latest    # Linux x64 (.deb)

    runs-on: ${{ matrix.os }}

    defaults:
      run:
        working-directory: code
        shell: bash

    steps:
    - name: Check out code
      uses: actions/checkout@v4
      with:
        path: 'code'
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven
    - name: Retrieve VERSION from file
      # tr -d '\r' guards against a CRLF checkout on the windows runner
      run: echo "VERSION=$(tr -d '\r' < src/main/resources/nl/utwente/groove/resource/version/GROOVE_VERSION)" >> $GITHUB_ENV
    - name: Build GROOVE
      run: mvn -B -Drevision=$VERSION -DskipTests -Dmaven.javadoc.skip=true clean install
    - name: Build release zip
      # bin+doc is excluded because it needs the javadoc skipped above
      run: cd release; mvn -B -Drevision=$VERSION -pl '!assembly/bin+doc' clean package
    - name: Build installer
      run: bash release/jpackage/build-installer.sh $VERSION
    - name: Attach installer to release
      if: github.event_name == 'push'
      uses: ncipollo/release-action@v1.14.0
      with:
        artifacts: "code/release/jpackage/target/dist/*"
        allowUpdates: true
        omitBodyDuringUpdate: true
        omitNameDuringUpdate: true
        omitDraftDuringUpdate: true
        omitPrereleaseDuringUpdate: true
    - name: Upload installer as workflow artifact (manual run)
      if: github.event_name == 'workflow_dispatch'
      uses: actions/upload-artifact@v4
      with:
        name: installer-${{ matrix.os }}
        path: code/release/jpackage/target/dist/*
